# Fleet server: every part runs in a container and is started with Docker Compose.
#
#   docker compose up -d --build                      database, one-off setup, API + console, worker
#   docker compose run --rm manage org "Acme Ltd"     admin commands (organisations, keys, tokens)
#   docker compose run --rm test                      the server's tests, against a throwaway database
#
# Both published ports are bound to 127.0.0.1: reachable from this machine only. For anything beyond a
# developer PC put a TLS reverse proxy in front and set both passwords (see README).
name: aios-fleet

x-app: &app
  build: {context: .., dockerfile: server/Dockerfile, target: app}      # the root: see Dockerfile
  image: aios-fleet-app

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fleet
    ports: ["127.0.0.1:5433:5432"]
    volumes: ["fleet-db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fleet"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Creates or updates the tables and sets the application role's password, then exits.
  init:
    <<: *app
    command: ["python", "-m", "app.manage", "init"]
    environment:
      DATABASE_URL_OWNER: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/fleet
      FLEET_APP_PASSWORD: ${FLEET_APP_PASSWORD:-fleet_app}
      FLEET_WORKER_PASSWORD: ${FLEET_WORKER_PASSWORD:-fleet_worker}
    depends_on:
      db: {condition: service_healthy}

  api:
    <<: *app
    environment:
      DATABASE_URL: postgresql://fleet_app:${FLEET_APP_PASSWORD:-fleet_app}@db:5432/fleet
      # encrypts the second-factor secrets; the database never sees it. The default is for a developer PC only:
      # make your own with  docker compose run --rm manage secret-key  and put it in .env
      FLEET_SECRET_KEY: ${FLEET_SECRET_KEY:-ZGV2ZWxvcGVyLXBjLW9ubHktbm90LWEtc2VjcmV0ISE=}
    ports: ["127.0.0.1:8770:8770"]
    depends_on:
      init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8770/healthz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Keeps the public CVE, known-exploited and end-of-life lists (its own volume) and judges every device
  # against them. The only container that goes online, and only to download those lists.
  worker:
    <<: *app
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql://fleet_worker:${FLEET_WORKER_PASSWORD:-fleet_worker}@db:5432/fleet
    volumes: ["fleet-ref:/data/ref"]
    depends_on:
      init: {condition: service_completed_successfully}
    restart: unless-stopped

  # Admin commands, run on demand:  docker compose run --rm manage token "Acme Ltd" --uses 5
  manage:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "-m", "app.manage"]
    environment:
      DATABASE_URL_OWNER: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/fleet
      PUBLIC_URL: ${PUBLIC_URL:-http://127.0.0.1:8770}
    depends_on:
      db: {condition: service_healthy}

  # The tests, run on demand. They create a database of their own in the same server and drop it afterwards.
  test:
    build: {context: .., dockerfile: server/Dockerfile, target: test}
    image: aios-fleet-test
    profiles: ["tools"]
    environment:
      TEST_DATABASE_URL_OWNER: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      FLEET_APP_PASSWORD: ${FLEET_APP_PASSWORD:-fleet_app}
      FLEET_WORKER_PASSWORD: ${FLEET_WORKER_PASSWORD:-fleet_worker}
      FLEET_SECRET_KEY: ZGV2ZWxvcGVyLXBjLW9ubHktbm90LWEtc2VjcmV0ISE=
    depends_on:
      init: {condition: service_completed_successfully}

volumes:
  fleet-db:
  fleet-ref:
